name: Commit about us icon
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG and clean up
        run: |
          set -euo pipefail
          cat about/about-us-icon.png.b64.part{0..4} | base64 -d > about/about-us-icon.png
          python3 -c 'import hashlib; raw=open("about/about-us-icon.png","rb").read(); assert raw[:8]==b"\x89PNG\r\n\x1a\n", raw[:16]; assert len(raw)==70667; assert hashlib.sha256(raw).hexdigest()=="e3f8d0f8157ed3a0ccce986a6d175c87d1362f0b17107a72f9ee713e25b35ea7"; print("png ok", len(raw))
          rm -f about/about-us-icon.png.b64.part{0..4}
          rm -f about/about-us-icon.png.b64 about/_encoding-test.png
          rm -f .github/workflows/commit-about-icon.yml
      - name: Commit
        run: |
          git config user.name "haven-bot"
          git config user.email "haven-bot@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Add About us tile icon (Wade and Josy cartoon)"
          git push
