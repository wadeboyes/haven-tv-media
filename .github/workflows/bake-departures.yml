name: Bake Haven departures
on:
  schedule:
    - cron: "17 17 * * *"   # 3:17am Brisbane every day (17:17 UTC)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bake next 8 days of departures from Translink GTFS (no key)
        run: |
          cd transport
          python bake_departures.py 8
      - name: Commit if changed
        run: |
          git config user.name "haven-bot"
          git config user.email "haven-bot@users.noreply.github.com"
          git add transport/departures.json
          git diff --cached --quiet || git commit -m "Update departures"
          git push
